<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pylon</title>
<meta name="description" content="hello@pylontrading.com">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #fbfaf8;
    --fg: #16181d;
    --rule: #e5e2dc;
    --muted: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --fg: #e8e6e1;
      --rule: #262a31;
      --muted: #8b929e;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    align-items: flex-start;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 2rem;
    text-align: left;
  }
  hr {
    width: 100%;
    max-width: 16rem;
    border: 0;
    border-top: 1px solid var(--rule);
  }
  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  a {
    color: inherit;
    text-decoration: none;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
  }
  a:hover { color: var(--muted); }
  footer {
    position: fixed;
    bottom: 1.5rem;
    right: 2rem;
    color: var(--muted);
    font-size: 0.65rem;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<h1>Frontier markets</h1>
<hr>
<a href="mailto:hello@pylontrading.com">hello@pylontrading.com</a>
<footer>Pylon Capital LLC &copy; 2026</footer>
</body>
</html>
